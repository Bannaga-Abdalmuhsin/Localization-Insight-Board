kind = "web"
previewPath = "/"
title = "Department Saudization Dashboard"
version = "1.0.0"
id = "artifacts/saudization-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25039

[services.development]
run = "pnpm --filter @workspace/saudization-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saudization-dashboard", "run", "build" ]
publicDir = "artifacts/saudization-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25039"
BASE_PATH = "/"
